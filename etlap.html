<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Étlapok – Radnóti Miklós Gimnázium</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .logo {
      background: #b71234;
      color: white;
      font-size: 28px;
      font-weight: bold;
      padding: 10px 24px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .school {
      color: #555;
      font-size: 15px;
      margin-bottom: 28px;
    }
    h2 {
      color: #b71234;
      font-size: 18px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      background: #b71234;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    .btn:hover { background: #8e0e27; }
    .loading { color: #888; font-size: 15px; }
    .error { color: #b71234; font-size: 15px; }

    .months = {
      1: "Január", 2: "Február", 3: "Március", 4: "Április",
      5: "Május", 6: "Június", 7: "Július", 8: "Augusztus",
      9: "Szeptember", 10: "Október", 11: "November", 12: "December"
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">HunGast</div>
    <div class="school">Radnóti Miklós Gimnázium – Dunakeszi</div>
    <h2>Étrendek</h2>
    <div id="menus"><p class="loading">Étlapok betöltése...</p></div>
  </div>

  <script>
    const MONTHS = {
      1: "Január", 2: "Február", 3: "Március", 4: "Április",
      5: "Május", 6: "Június", 7: "Július", 8: "Augusztus",
      9: "Szeptember", 10: "Október", 11: "November", 12: "December"
    };

    async function loadMenus() {
      const container = document.getElementById('menus');
      try {
        const response = await fetch(
          'https://api.hungast.hu/menus?filters[0]=institution.id=894&fields=*'
        );
        const data = await response.json();

        if (!data.data || data.data.length === 0) {
          container.innerHTML = '<p class="error">Jelenleg nincs elérhető étlap.</p>';
          return;
        }

        container.innerHTML = data.data.map(menu => {
          const monthName = MONTHS[menu.month] || menu.month;
          const year = menu.year;
          const src = menu.upload?.data?.files?.data?.[0]?.files?.[0]?.src;
          if (!src) return '';
          return `<a class="btn" href="${src}" target="_blank">${year} ${monthName}i étlap</a>`;
        }).join('');

      } catch (e) {
        container.innerHTML = '<p class="error">Hiba történt az étlapok betöltésekor.</p>';
      }
    }

    loadMenus();
  </script>
</body>
</html>
